[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "rcaground"
dynamic = ["version"]
description = "Reproducible evaluation of evidence grounding in LLM-generated root cause analysis for microservice systems"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "Sankara Nainar Paramasivan" }]
keywords = ["root cause analysis", "AIOps", "LLM evaluation", "faithfulness", "microservices", "benchmark"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: System :: Monitoring",
]
dependencies = [
  "numpy>=1.26",
  "pandas>=2.1",
  "networkx>=3.2",
  "PyYAML>=6.0",
  "pydantic>=2.5",
  "httpx>=0.27",
]

[project.optional-dependencies]
# Stage-2 NLI comparison judge (pulls torch; the model downloads on first use).
nli = ["sentence-transformers>=3.0"]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "hypothesis>=6.100", "ruff>=0.6"]

[project.urls]
Repository = "https://github.com/sankaranainar-p/rcaground"
Issues = "https://github.com/sankaranainar-p/rcaground/issues"

[tool.hatch.version]
path = "src/rcaground/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/rcaground"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E9", "F63", "F7", "F82"]
