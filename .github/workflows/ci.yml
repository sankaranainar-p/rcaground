name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: pip install -e ".[dev]"
      - name: Lint (syntax and undefined names)
        run: ruff check src tests scripts
      - name: Test (offline, no API keys)
        run: pytest -q
      - name: Smoke benchmark
        run: python -m rcaground.bench.run_benchmark --config src/rcaground/bench/configs/re1_ob_smoke.yaml
